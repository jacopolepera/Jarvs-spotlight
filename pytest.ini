[pytest]
testpaths = tests
addopts =
    -m "not lmstudio"
markers =
    integration: deterministic integration test using local fakes or subprocesses
    lmstudio: opt-in smoke test against the user's local LM Studio server

# The default suite never depends on a running LM Studio instance. Run that
# smoke test explicitly with ``-m lmstudio -o addopts=''`` when desired.
